name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core + CLI + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSC_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  plugin:
    name: plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2-dev libcurl4-openssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSC_BUILD_TESTS=OFF -DSC_BUILD_CLI=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Headless UI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 tools/make_demo_loop.py demo.wav --bpm 92
          xvfb-run -a build/plugin/SampleChopperSnapshot_artefacts/Release/SampleChopperSnapshot demo.wav ui.png
      - name: Upload UI screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: ui.png
      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: SampleChopper-${{ runner.os }}
          path: |
            build/plugin/SampleChopper_artefacts/Release/VST3
            build/plugin/SampleChopper_artefacts/Release/AU
            build/plugin/SampleChopper_artefacts/Release/Standalone
          if-no-files-found: error
